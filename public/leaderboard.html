<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Retro Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="manifest" href="/manifest.json">
  <script>if(localStorage.getItem("retroTheme")==="dark")document.documentElement.classList.add("dark-init");</script>
</head>
<body class="home-bg">
  <a class="skip-link" href="#app">Skip to content</a>
  <header>
    <h1>🚀 Retro Board</h1>
    <nav></nav>
  </header>
  <main id="app">
    <h2 data-i18n="leaderboard.title">🏆 Leaderboard</h2>
    <p class="muted">Earn 10 points for every commitment you complete!</p>
    <p style="text-align:right"><a class="btn secondary" href="javascript:history.back()">← Back</a></p>
    <table id="leaderboard-table">
      <thead>
        <tr><th>Rank</th><th>Participant</th><th>Points</th><th>Completed Commitments</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/leaderboard.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  </script>
</body>
</html>
