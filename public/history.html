<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — Retro Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="manifest" href="/manifest.json">
  <script>if(localStorage.getItem("retroTheme")==="dark")document.documentElement.classList.add("dark-init");</script>
</head>
<body class="home-bg">
  <a class="skip-link" href="#app">Skip to content</a>
  <header>
    <h1>🚀 Retro Board</h1>
    <nav></nav>
  </header>
  <main id="app">
    <h2 data-i18n="history.title">Past Retrospectives</h2>
    <p style="text-align:right"><a class="btn secondary" href="javascript:history.back()">← Back</a></p>
    <div class="history-filters" id="history-filters">
      <input id="filter-text" placeholder="🔍 Search title" style="max-width:200px">
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="open">🟢 Open</option>
        <option value="closed">✅ Closed</option>
      </select>
      <input type="date" id="filter-from" title="From date">
      <input type="date" id="filter-to" title="To date">
      <button class="btn small secondary" id="filter-clear">✕ Clear</button>
    </div>
    <div id="health-score-section"></div>
    <div id="evolution-chart" class="evolution-chart" style="position:relative"></div>
    <div id="retro-list" class="card-grid"></div>
  </main>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/history.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  </script>
</body>
</html>
